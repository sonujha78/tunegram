[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunegram"
version = "0.1.0"
description = "A Telegram music bot focused on clean, high-quality playback."
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0", "telethon>=1.36", "psutil>=6.0", "aiosqlite>=0.20", "yt-dlp[default]>=2025.11.12", "py-tgcalls>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
