[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunegram"
version = "0.1.0"
description = "A Telegram music bot focused on clean, high-quality playback."
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0", "telethon>=1.36"]

[tool.setuptools.packages.find]
where = ["src"]
